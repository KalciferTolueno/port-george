# =============================================================================
# Nginx server block for the Elena Voss photography portfolio
#
# Usage:
#   1. Replace `example.com` with your real domain.
#   2. Place this file at /etc/nginx/sites-available/portfolio.conf
#   3. Symlink:  sudo ln -s /etc/nginx/sites-available/portfolio.conf /etc/nginx/sites-enabled/
#   4. Test:     sudo nginx -t
#   5. Reload:   sudo systemctl reload nginx
#
# For free HTTPS run `sudo certbot --nginx -d yourdomain.com`
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    # ACME challenge for Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    # deploy.sh uploads the contents of dist/ directly here.
    root /var/www/portfolio;
    index index.html;

    # SSL certs (generated by Certbot)
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Brotli (optional — install nginx-module-brotli first)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript image/svg+xml;

    # Versioned assets (Vite output: /assets/<hash>.js|svg|...)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static public files copied verbatim
    location = /favicon.svg { expires 30d; access_log off; }
    location = /robots.txt  { expires 1d;  access_log off; }

    # Don't cache the HTML — so deploys are seen immediately
    location / {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Friendly error page
    error_page 404 /index.html;

    # Log files
    access_log /var/log/nginx/portfolio.access.log;
    error_log  /var/log/nginx/portfolio.error.log warn;
}
